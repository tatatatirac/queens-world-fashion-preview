  <script>
    (function () {
      try {
        var stored = localStorage.getItem("qw_preview_theme");
        var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "day");
      }
    })();
  </script>
